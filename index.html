<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gabriel's Creatives - Home</title>

    <!-- Tells the browser: "the visitor has started on Home."
         gallery.html checks this so it knows NOT to redirect. -->
    <script>
        sessionStorage.setItem('visited', 'true');
    </script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background: #f2f2f2; color: #333; line-height: 1.7; }
        header { background: white; text-align: center; padding: 25px 10px; }
        .logo { width: 60px; height: 60px; border: 2px solid #222; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 23px; font-weight: bold; margin-bottom: 10px; }
        .logo img { width: 100%; height: 100%; border-radius: 50%; }
        header h1 { font-size: 25px; letter-spacing: 2px; }
        nav { background: #222; padding: 15px; text-align: center; }
        nav a { color: white; text-decoration: none; margin: 0 18px; font-size: 14px; font-weight: bold; }
        nav a:hover, nav a.active { color: #d4af37; }
        .container { max-width: 850px; margin: 45px auto; padding: 35px; background: white; border-radius: 15px; box-shadow: 0 4px 12px #00000015; text-align: center; }
        h2 { font-size: 30px; margin-bottom: 20px; }
        .avatars { display: flex; justify-content: center; gap: 20px; margin-bottom: 25px; }
        .avatars img { width: 100px; height: 100px; border-radius: 50%; border: 4px solid #222; object-fit: cover; background: #ddd; }
        .container p { margin-bottom: 22px; }
        .btn { display: inline-block; background: #222; color: white; text-decoration: none; font-size: 14px; font-weight: bold; padding: 12px 28px; border-radius: 25px; }
        .btn:hover { background: #d4af37; color: #222; }
        footer { background: black; color: white; text-align: center; padding: 20px; font-size: 14px; }
        @media (max-width: 600px) { header h1 { font-size: 18px; } nav a { margin: 0 7px; font-size: 12px; } .container { margin: 25px 15px; padding: 25px 20px; } h2 { font-size: 24px; } .avatars img { width: 80px; height: 80px; } .avatars { gap: 12px; } }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <img src="logo.jpg" alt="Gabriel's Creatives Logo">
        </div>
        <h1>GABRIEL'S CREATIVES</h1>
    </header>

    <!-- All links are lowercase and match the file names exactly -->
    <nav>
        <a href="index.html" class="active">HOME</a>
        <a href="about.html">ABOUT</a>
        <a href="gallery.html">GALLERY</a>
        <a href="contact.html">CONTACT</a>
    </nav>

    <main class="container">
        <h2>Experience the Creative</h2>

        <div class="avatars">
            <img src="me2.jpg" alt="Photo 1">
            <img src="me3.jpg" alt="Photo 2">
            <img src="me4.jpg" alt="Photo 3">
        </div>

        <p>Step into a world where every detail is a masterpiece. Gabriel's Creative Collections offers a unique blend of modern innovation and timeless elegance.</p>

        <a href="about.html" class="btn">LEARN MORE</a>
    </main>

    <footer>
        <p>&copy; 2026 Gabriel's Creatives</p>
    </footer>
</body>
</html>
